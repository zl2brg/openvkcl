name: Release

# Push a tag like v0.3.0 to build that version's installers for all three
# platforms and attach them to the tag's GitHub release (a draft unless you've
# already created it). Running it manually uses the version in tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Set version from tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION.replace(/^v/, "");
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const c = "src-tauri/Cargo.toml";
            fs.writeFileSync(c, fs.readFileSync(c, "utf8").replace(/^version = ".*"$/m, `version = "${v}"`));
          '

      # The Windows installer ships Hamlib's rigctld so radios work without installing anything else.
      - name: Bundle Hamlib (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $v = "4.7.2"
          Invoke-WebRequest "https://github.com/Hamlib/Hamlib/releases/download/$v/hamlib-w64-$v.zip" -OutFile hamlib.zip
          if ((Get-FileHash hamlib.zip -Algorithm SHA256).Hash -ne "8553bc6c5c6032e8debf99c017e98f58fed7e07e7c25d04815dc3e8bbe3304c7") {
            throw "Hamlib download doesn't match its published SHA-256"
          }
          Expand-Archive hamlib.zip -DestinationPath hamlib-zip
          $src = "hamlib-zip/hamlib-w64-$v"
          New-Item -ItemType Directory -Force src-tauri/hamlib | Out-Null
          Copy-Item "$src/bin/rigctld.exe", "$src/bin/*.dll", "$src/COPYING*.txt", "$src/LICENSE.txt" src-tauri/hamlib/

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: OpenVKCL ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: Installers for Windows, Linux and macOS.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
