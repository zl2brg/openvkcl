[package]
name = "openvkcl"
version = "0.6.0"
description = "Contest logger for Australian and New Zealand contests"
authors = ["Simon, ZL2BRG <simon.eatough@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/zl2brg/openvkcl"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openvkcl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
toml = "1.1.8"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.54.1", features = ["net", "time", "io-util", "sync", "macros", "rt", "process"] }
tauri-plugin-dialog = "2.8.4"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
serialport = { version = "4.10.1", default-features = false }
reqwest = { version = "0.13", features = ["query"] }
socket2 = { version = "0.6", features = ["all"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "recording"] }
hound = "3.5"


[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
