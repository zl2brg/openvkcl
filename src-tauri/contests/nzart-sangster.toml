# NZART Sangster Shield (one-night format from 2026)
# https://nzart.org.nz/activities/contests/sangster-shield/
#
# Third Saturday in May, 0800-1100 UTC (2000-2300 NZST), six half-hour periods,
# 80 m CW only, 5 W maximum for ZL stations. Logs to sangster@nzart.org.nz by
# the fourth Saturday after the contest.
id = "nzart-sangster"
name = "NZART Sangster Shield"
cabrillo_name = "NZART-SANGSTER"
rules_url = "https://nzart.org.nz/activities/contests/sangster-shield/"
duration_minutes = 180
default_start_utc = "08:00"
bands = ["80m"]
modes = ["CW"]
exchange = ["rst", "serial", "number"]
number_label = "Branch"
# Overseas stations send RST and serial only.
number_from = ["ZL", "ZM"]

# Once per station in each complete half hour (0800-0829, 0830-0859...).
[blocks]
minutes = 30

[rework]
kind = "block"
per = ["band"]

[scoring]
formula = "points_times_mults"

# NZ to NZ 5 points; NZ to overseas (either way) 10 points.
[scoring.points]
kind = "fixed"
base = 5
foreign = { home = ["ZL", "ZM"], points = 10 }

# Branches worked; your own branch scores points only.
[multiplier]
kind = "number"
not_own = true

[[categories]]
key = "SECTION"
label = "Section"
options = [
    "OPEN",
    "FIRST TIME (TRANSISTOR TROPHY)",
    "SOUTH ISLAND (ARTHUR STEVENS TROPHY)",
    "OVERSEAS",
    "CHECKLOG",
]
default = "OPEN"

[[categories]]
key = "CATEGORY-POWER"
label = "Power (ZL stations 5 W maximum)"
options = ["QRP", "LOW", "HIGH"]
default = "QRP"

[[categories]]
key = "CATEGORY-MODE"
label = "Mode"
options = ["CW"]
default = "CW"
