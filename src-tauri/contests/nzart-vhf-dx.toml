# NZART VHF-UHF-SHF-EHF DX Weekend Contest (rules with effect from January 2016)
# https://nzart.org.nz/activities/contests/vhf/
#
# Second Saturday in February. Operating periods 17:00-23:00 Saturday and
# 07:00-13:00 Sunday NZDT, i.e. 04:00-10:00 and 18:00-24:00 UTC Saturday.
# Logs go by email to vhfcontest@nzart.org.nz within two weeks.
id = "nzart-vhf-dx"
name = "NZART VHF DX Weekend"
cabrillo_name = "NZART-VHF-UHF-SHF-EHF"
rules_url = "https://nzart.org.nz/activities/contests/vhf/"
duration_minutes = 1200
default_start_utc = "04:00"
bands = ["6m", "2m", "70cm", "33cm", "23cm", "13cm", "9cm", "6cm", "3cm", "1.25cm", "6mm", "4mm", "2.5mm", "2mm", "1mm"]
modes = ["PH", "CW", "RY", "DG"]
exchange = ["rst", "serial", "locator"]
# Each band is a separate mini-contest with its own serial numbers.
serial_per_band = true

[[sessions]]
start_minute = 0
minutes = 360

[[sessions]]
start_minute = 840
minutes = 360

# Each hour is a period; a station may be worked once per band per period.
[blocks]
minutes = 60

[rework]
kind = "block"
per = ["band"]

[scoring]
formula = "sum_points"
round = "nearest"

# QRP x1.5, then field station x1.2.
[[scoring.bonus]]
category = "CATEGORY-POWER"
value = "QRP"
factor = 1.5

[[scoring.bonus]]
category = "CATEGORY-STATION"
value = "PORTABLE"
factor = 1.2

[scoring.points]
kind = "distance"
# Machine modes (RTTY, packet, WSJT...) score x1.5.
mode = { RY = 1.5, DG = 1.5 }
band_factor = { "33cm" = 0.3, "23cm" = 0.2, "13cm" = 0.5, "9cm" = 1, "6cm" = 1, "3cm" = 1, "1.25cm" = 1, "6mm" = 1, "4mm" = 1, "2.5mm" = 1, "2mm" = 1, "1mm" = 1 }

[scoring.points.band_table]
"6m" = [[25, 1], [50, 2], [75, 3], [100, 5], [150, 7], [200, 10], [300, 12], [400, 15], [500, 20], [600, 25], [800, 25], [1200, 25], [2000, 35], [3000, 50], [4000, 60], [5000, 80], [inf, 100]]
"2m" = [[25, 1], [50, 2], [75, 3], [100, 5], [150, 7], [200, 10], [300, 12], [400, 15], [500, 20], [600, 25], [800, 40], [1200, 50], [2000, 75], [3000, 125], [4000, 175], [5000, 225], [inf, 250]]
"70cm" = [[25, 2], [50, 3], [75, 5], [100, 7], [150, 10], [200, 15], [300, 20], [400, 30], [500, 40], [600, 50], [800, 75], [1200, 100], [2000, 150], [3000, 250], [4000, 350], [5000, 450], [inf, 500]]

# Each band is scored as a separate mini-contest.
[[score_groups]]
name = "6m"
bands = ["6m"]

[[score_groups]]
name = "2m"
bands = ["2m"]

[[score_groups]]
name = "70cm"
bands = ["70cm"]

[[score_groups]]
name = "33cm"
bands = ["33cm"]

[[score_groups]]
name = "23cm"
bands = ["23cm"]

[[score_groups]]
name = "13cm"
bands = ["13cm"]

[[score_groups]]
name = "9cm"
bands = ["9cm"]

[[score_groups]]
name = "6cm"
bands = ["6cm"]

[[score_groups]]
name = "3cm"
bands = ["3cm"]

[[score_groups]]
name = "1.25cm"
bands = ["1.25cm"]

[[score_groups]]
name = "6mm"
bands = ["6mm"]

[[score_groups]]
name = "4mm"
bands = ["4mm"]

[[score_groups]]
name = "2.5mm"
bands = ["2.5mm"]

[[score_groups]]
name = "2mm"
bands = ["2mm"]

[[score_groups]]
name = "1mm"
bands = ["1mm"]

[[categories]]
key = "CATEGORY-OPERATOR"
label = "Operator"
options = ["SINGLE-OP", "MULTI-OP", "CHECKLOG"]
default = "SINGLE-OP"

[[categories]]
key = "CATEGORY-STATION"
label = "Station (PORTABLE = field station, x1.2)"
options = ["FIXED", "PORTABLE"]
default = "FIXED"

[[categories]]
key = "CATEGORY-POWER"
label = "Power (QRP = 5 W or less, x1.5)"
options = ["HIGH", "LOW", "QRP"]
default = "HIGH"

[[categories]]
key = "CATEGORY-BAND"
label = "Band"
options = ["ALL"]
default = "ALL"

[[categories]]
key = "CATEGORY-MODE"
label = "Mode"
options = ["MIXED", "SSB", "CW", "DIGI"]
default = "MIXED"
