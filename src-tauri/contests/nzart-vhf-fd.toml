# NZART VHF-UHF-SHF-EHF Field Day Contest (rules with effect from January 2016)
# https://nzart.org.nz/activities/contests/vhf/
#
# First Saturday in December. Operating periods 17:00-23:00 Saturday and
# 07:00-13:00 Sunday NZDT, i.e. 04:00-10:00 and 18:00-24:00 UTC Saturday.
# Logs go by email to vhfcontest@nzart.org.nz within two weeks.
id = "nzart-vhf-fd"
name = "NZART VHF Field Day"
cabrillo_name = "NZART-VHF-UHF-SHF-EHF"
rules_url = "https://nzart.org.nz/activities/contests/vhf/"
duration_minutes = 1200
default_start_utc = "04:00"
bands = ["6m", "2m", "70cm", "33cm", "1.2G", "2.3G", "3.4G", "5.7G", "10G", "24G", "47G", "75G", "122G", "134G", "241G"]
modes = ["PH", "CW", "RY", "DG"]
exchange = ["rst", "serial", "locator"]
# Each band is a separate mini-contest with its own serial numbers.
serial_per_band = true

[[sessions]]
start_minute = 0
minutes = 360

[[sessions]]
start_minute = 840
minutes = 360

# Each hour is a period; a station may be worked once per band per period.
[blocks]
minutes = 60

[rework]
kind = "block"
per = ["band"]

[scoring]
formula = "sum_points"
round = "nearest"

# QRP x1.5, then field station x1.2.
[[scoring.bonus]]
category = "CATEGORY-POWER"
value = "QRP"
factor = 1.5
per_band = true
label = "QRP bonus (5 W or less, x1.5) on"

[[scoring.bonus]]
category = "CATEGORY-STATION"
value = "PORTABLE"
factor = 1.2

[scoring.points]
kind = "distance"
# Machine modes (RTTY, packet, WSJT...) score x1.5.
mode = { RY = 1.5, DG = 1.5 }
band_factor = { "33cm" = 0.3, "1.2G" = 0.2, "2.3G" = 0.5, "3.4G" = 1, "5.7G" = 1, "10G" = 1, "24G" = 1, "47G" = 1, "75G" = 1, "122G" = 1, "134G" = 1, "241G" = 1 }

[scoring.points.band_table]
"6m" = [[25, 1], [50, 2], [75, 3], [100, 5], [150, 7], [200, 10], [300, 12], [400, 15], [500, 20], [600, 25], [800, 25], [1200, 25], [2000, 35], [3000, 50], [4000, 60], [5000, 80], [inf, 100]]
"2m" = [[25, 1], [50, 2], [75, 3], [100, 5], [150, 7], [200, 10], [300, 12], [400, 15], [500, 20], [600, 25], [800, 40], [1200, 50], [2000, 75], [3000, 125], [4000, 175], [5000, 225], [inf, 250]]
"70cm" = [[25, 2], [50, 3], [75, 5], [100, 7], [150, 10], [200, 15], [300, 20], [400, 30], [500, 40], [600, 50], [800, 75], [1200, 100], [2000, 150], [3000, 250], [4000, 350], [5000, 450], [inf, 500]]

# Each band is scored as a separate mini-contest.
[[score_groups]]
name = "6m"
bands = ["6m"]

[[score_groups]]
name = "2m"
bands = ["2m"]

[[score_groups]]
name = "70cm"
bands = ["70cm"]

[[score_groups]]
name = "33cm"
bands = ["33cm"]

[[score_groups]]
name = "1.2G"
bands = ["1.2G"]

[[score_groups]]
name = "2.3G"
bands = ["2.3G"]

[[score_groups]]
name = "3.4G"
bands = ["3.4G"]

[[score_groups]]
name = "5.7G"
bands = ["5.7G"]

[[score_groups]]
name = "10G"
bands = ["10G"]

[[score_groups]]
name = "24G"
bands = ["24G"]

[[score_groups]]
name = "47G"
bands = ["47G"]

[[score_groups]]
name = "75G"
bands = ["75G"]

[[score_groups]]
name = "122G"
bands = ["122G"]

[[score_groups]]
name = "134G"
bands = ["134G"]

[[score_groups]]
name = "241G"
bands = ["241G"]

[[categories]]
key = "CATEGORY-OPERATOR"
label = "Operator"
options = ["SINGLE-OP", "MULTI-OP", "CHECKLOG"]
default = "SINGLE-OP"

[[categories]]
key = "CATEGORY-STATION"
label = "Station (PORTABLE = field station, x1.2)"
options = ["FIXED", "PORTABLE"]
default = "FIXED"

[[categories]]
key = "CATEGORY-POWER"
label = "Power (QRP = 5 W or less)"
options = ["HIGH", "LOW", "QRP"]
default = "HIGH"

[[categories]]
key = "CATEGORY-BAND"
label = "Band"
options = ["ALL"]
default = "ALL"

[[categories]]
key = "CATEGORY-MODE"
label = "Mode"
options = ["MIXED", "SSB", "CW", "DIGI"]
default = "MIXED"
